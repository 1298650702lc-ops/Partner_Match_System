spring:
  application:
    name: Partner_back
  datasource:
    url: jdbc:mysql://localhost:3306/partner?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    #文件上传大小限制
  servlet:
    multipart:
      #最大单个文件大小S
      max-file-size: 10MB
      #最大请求大小（包括所有文件和表单数据）
      max-request-size: 100MB
server:
  port: 8080
  servlet:
    session:
      timeout: 30m

#配置事务管理日志级别
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

#配置aliyun oss工具类信息
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: tials-smart-sys
    region: cn-beijing

# 配置 MyBatis-Plus
mybatis-plus:
  configuration:
    # 打印执行的 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启下划线转驼峰
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 逻辑删除的实体字段名
      logic-delete-field: isDelete
      # 已删除值
      logic-delete-value: 1
      # 未删除值
      logic-not-delete-value: 0